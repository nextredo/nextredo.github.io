# Hugo configuration
baseURL = "https://nextredo.github.io/"
locale = "en-au"
title = "Mega Epic Website 🌠🌐🔍"
theme = "brojs"
copyright = "🄯 AGPLv3"
# enableGitInfo = true

[module]
  # Explicitly keep existing static dir mount
  [[module.mounts]]
    source = "static"
    target = "static"

  # Mount LICENSE file
  [[module.mounts]]
    source = "../LICENSE"
    target = "static/LICENSE"

# Menu items
[menu]
  [[menu.main]]
    name = "🏡 Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "🪰 Cool Sites"
    url = "/sites/"
    weight = 20

  [[menu.main]]
    name = "📯 Posts"
    url = "/posts/"
    weight = 30

  [[menu.main]]
    name = "🏷️ Tags"
    url = "/tags/"
    weight = 40

  [[menu.main]]
    name = "🧐 About"
    url = "/about/"
    weight = 50


# Custom parameters
[params]
  repo_url = "https://github.com/nextredo/nextredo.github.io"

  [params.footer]
    made_with_statement = true

  # Supplementary copyright license information
  [params.license]
    # https://www.gnu.org/graphics/license-logos.html
    image = "images/agplv3-license.png"
