baseURL = "https://nextredo.github.io/"
locale = "en-au"
title = "Mega Epic Website 🌠🌐🔍"
theme = "nojs"

# Menu items
[menu]
[[menu.main]]
name = "🏡 Home"
url = "/"
weight = 1

[[menu.main]]
name = "🪰 Cool Sites"
url = "/sites/"
weight = 2

[[menu.main]]
name = "📯 Posts"
url = "/posts/"
weight = 3

[[menu.main]]
name = "🏷️ Tags"
url = "/tags/"
weight = 3

[[menu.main]]
name = "🧐 About"
url = "/about/"
weight = 4

# Theme settings
[params]
description = "Website 👍"

# Content Display
show_featured_sections = true
show_stats = true
show_retro_elements = true
show_sharing = true

# Footer Options
show_retro_footer = true
show_build_info = false

# Sidebar Options
show_sidebar_stats = true
show_retro_sidebar = true
sidebar_content = "🐬🫧🦋🐠"

